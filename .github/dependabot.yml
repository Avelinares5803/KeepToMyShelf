version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a few days after a release before proposing it: protects against
    # compromised or broken versions that get pulled shortly after publishing.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Node.js type definitions must match the Node.js bundled with Electron
      # (Node 24 in Electron 44). Bump them manually together with Electron.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet (peer: typescript <6.1).
      # Remove this entry once typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Minor and patch updates are bundled into one PR per dependency type;
      # major updates arrive as individual PRs because they may need code changes.
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
