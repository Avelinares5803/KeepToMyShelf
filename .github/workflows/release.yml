name: Release

# Pushing a version tag (v1.0.0, v1.0.0-rc.1...) builds the installer and the portable zip, tests
# them and creates a draft release with them. The maintainer reviews and publishes it by hand.
# See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

# Least privilege: only the job that creates the release may write to the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check that the tag matches the version in package.json
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "The tag $env:TAG does not match the version in package.json ($version)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # The same checks as the CI: a release is never built from code that fails them.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests
        run: npx playwright test

      - name: Package the installer and the portable zip
        run: npm run package
      - name: Smoke test the installer and the portable zip
        run: npm run test:smoke

      - name: Write the checksums
        shell: pwsh
        working-directory: release/${{ steps.version.outputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = "KeepToMyShelf-Setup-$env:VERSION.exe", "KeepToMyShelf-Portable-$env:VERSION.zip"
          # The format of sha256sum: "<hash>  <file>", which `sha256sum -c` can check.
          $lines = foreach ($file in $files) {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLower(), $file
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Keep the release files for the next job
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            release/${{ steps.version.outputs.version }}/KeepToMyShelf-Setup-${{ steps.version.outputs.version }}.exe
            release/${{ steps.version.outputs.version }}/KeepToMyShelf-Portable-${{ steps.version.outputs.version }}.zip
            release/${{ steps.version.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-traces
          path: test-results/
          retention-days: 7

  release:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist
      # gh comes with GitHub's runners; it uses this workflow's own token, no personal one.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A version with a suffix (1.0.0-rc.1) is marked as a pre-release.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            "${prerelease[@]}" \
            --title "KeepToMyShelf $VERSION" \
            --notes-file .github/release-notes.md
