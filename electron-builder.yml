appId: io.github.avelinares5803.keeptomyshelf
productName: KeepToMyShelf
copyright: Copyright © 2026 Avelinares5803
directories:
  output: release/${version}
files:
  - out/**
  - package.json
# Native binaries cannot be loaded from inside the asar archive.
asarUnpack:
  - '**/*.node'
  - node_modules/sharp/**
  - node_modules/@img/**
# better-sqlite3 and sharp ship N-API prebuilt binaries that work in Electron as-is.
npmRebuild: false
# Switches burnt into the packaged .exe (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  # The .exe cannot be used as a plain Node.js with ELECTRON_RUN_AS_NODE (VS Code's terminal
  # sets it: the app still opens from there).
  runAsNode: false
  # NODE_OPTIONS cannot inject code or options at startup.
  enableNodeOptionsEnvironmentVariable: false
  # The app only starts from its own app.asar, and only if it has not been modified.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Kept on: Playwright needs --inspect to drive the packaged app in the release smoke test, and
  # only someone who can already run programs as the user could use it.
  enableNodeCliInspectArguments: true
win:
  # Rendered from build/icon.svg (scripts/render-icon.mjs); electron-builder makes the .ico.
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
# The portable .zip is made from release/<version>/win-unpacked by scripts/package-portable.mjs,
# because it also carries the "KeepToMyShelf Data" folder that the installer must not have.
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # The installer speaks the system's language: Spanish or, otherwise, English.
  installerLanguages: [es_ES, en_US]
  multiLanguageInstaller: true
  # Uninstalling never deletes the libraries in %APPDATA%\KeepToMyShelf.
  deleteAppDataOnUninstall: false
publish: null
