name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the previous, now outdated, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # End-to-end tests drive the real app window; Linux would need a virtual display (xvfb).
      - name: End-to-end tests
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: Upload E2E traces on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  package-windows:
    name: Package (Windows)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:dir
